# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# Apache Airflow Service Configuration: airflow.cfg
# ==============================================================================

[core]
# Directory where Airflow DAGs reside
dags_folder = /opt/airflow/dags

# Directory where custom plugins reside
plugins_folder = /opt/airflow/plugins

# Execution backend: LocalExecutor for parallel local worker process execution
executor = LocalExecutor

# Relational backend database connection URI (PostgreSQL Metastore)
sql_alchemy_conn = postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow

# The amount of parallelism as a configureable to limit the number of task instances running
parallelism = 32

# The maximum number of active task instances per DAG
max_active_tasks_per_dag = 16

# The maximum number of active DAG runs per DAG
max_active_runs_per_dag = 8

# Do not automatically unpause DAGs at creation
dags_are_paused_at_creation = True

# Do not load example or tutorial DAGs
load_examples = False

# Do not load default connections
load_default_connections = False

# Default timezone for DAG evaluation and UI display
default_timezone = utc

# Key for encrypting connection passwords and sensitive variables
fernet_key = 46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqJZPo=

# Don't show stack traces on UI error pages
donot_pickle = True

[database]
# Primary database connection string for Airflow 2.x metadata
sql_alchemy_conn = postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow

# Maximum database connection pool size
sql_alchemy_pool_size = 10

# Maximum overflow connections above pool size
sql_alchemy_max_overflow = 20

# Connection recycle time in seconds
sql_alchemy_pool_recycle = 1800

[logging]
# Root folder where task log files are stored
base_log_folder = /opt/airflow/logs

# Log filename template for task instances
log_filename_template = dag_id={{ ti.dag_id }}/run_id={{ ti.run_id }}/task_id={{ ti.task_id }}/attempt={{ try_number }}.log

# Minimum logging level
logging_level = INFO

# Standard log record format
log_format = [%%(asctime)s] {%%(filename)s:%%(lineno)d} %%(levelname)s - %%(message)s

[webserver]
# Webserver base URL
base_url = http://localhost:8080

# Webserver host listening IP
web_server_host = 0.0.0.0

# Webserver listening port
web_server_port = 8080

# Secret key used for signing session cookies and CSRF tokens
secret_key = lakehouse_airflow_secret_key_2025

# Number of Gunicorn worker processes
workers = 2

# Worker refresh interval in seconds
worker_refresh_interval = 3600

# Number of seconds before a worker is killed if not responding
web_server_worker_timeout = 120

# Expose configuration in web interface for admin inspection
expose_config = True

# Enable Role-Based Access Control (RBAC) UI
rbac = True

# Session lifetime in minutes
session_lifetime_minutes = 43200

[scheduler]
# Heartbeat interval for scheduler process in seconds
scheduler_heartbeat_sec = 5

# Job heartbeat interval
job_heartbeat_sec = 5

# Interval to scan DAG directory for new files in seconds
dag_dir_list_interval = 30

# Minimum interval between parsing the same DAG file
min_file_process_interval = 10

# Number of scheduler parsing worker processes
parsing_processes = 2

# Clean dead jobs every N seconds
clean_tis_without_dagrun_interval = 15

[api]
# Authentication backends for Airflow REST API
auth_backends = airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session

# Maximum items returned in a single page
maximum_page_limit = 100
fallback_page_limit = 25
