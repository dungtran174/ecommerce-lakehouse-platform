# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# dbt Silver Model Documentation & Schema Assertions: silver_brands
# ==============================================================================

version: 2

models:
  - name: silver_brands
    description: >
      Conformed Silver Delta Lake table storing validated commercial brands catalog.
      Deduplicates raw brand records by brand_id, trims brand names and origin countries,
      fills missing origins with 'Unknown', and writes ACID Delta tables.
    columns:
      - name: brand_id
        description: "Primary key alphanumeric brand identifier."
        tests:
          - unique
          - not_null

      - name: brand_name
        description: "Trimmed registered commercial brand trademark name."
        tests:
          - not_null

      - name: brand_origin
        description: "Standardized country or geographic region of brand origin."
        tests:
          - not_null

      - name: _transformed_at
        description: "Timestamp when the record was processed into the Silver Delta Lake layer."
        tests:
          - not_null
