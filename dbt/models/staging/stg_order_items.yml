# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# dbt Staging Model Documentation & Schema Assertions: stg_order_items
# ==============================================================================

version: 2

models:
  - name: stg_order_items
    description: >
      Staging view for transactional sales order line items. Cleanses surrogate item IDs,
      calculates net line item financial amounts after discounts, applies incremental watermarking
      filters, and attaches ingestion audit metadata.
    columns:
      - name: order_item_id
        description: "Primary key identifier for the individual line item."
        tests:
          - unique
          - not_null

      - name: order_id
        description: "Foreign key reference to stg_orders.order_id."
        tests:
          - not_null

      - name: product_id
        description: "Foreign key reference to stg_products.product_id."
        tests:
          - not_null

      - name: quantity
        description: "Number of units purchased for this SKU."
        tests:
          - not_null

      - name: price
        description: "Unit price of SKU at transaction time in VND."
        tests:
          - not_null

      - name: discount
        description: "Promotional discount amount applied to the line item."
        tests:
          - not_null

      - name: line_total_amount
        description: "Calculated gross amount minus discount: (quantity * price - discount)."
        tests:
          - not_null

      - name: _ingested_at
        description: "Metadata timestamp when the record was processed by dbt."
        tests:
          - not_null
