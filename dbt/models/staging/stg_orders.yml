# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# dbt Staging Model Documentation & Schema Assertions: stg_orders
# ==============================================================================

version: 2

models:
  - name: stg_orders
    description: >
      Staging view for transactional sales orders. Cleanses integer surrogate keys,
      casts total financial amounts to double precision, extracts order dates,
      applies incremental watermarking filters on updated_at, and attaches ingestion audit metadata.
    columns:
      - name: order_id
        description: "Primary key identifier for the customer sales order."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Foreign key reference to stg_customers.customer_id."
        tests:
          - not_null

      - name: order_timestamp
        description: "UTC timestamp when the transaction occurred."
        tests:
          - not_null

      - name: order_date
        description: "Calendar date when the order was placed (YYYY-MM-DD)."
        tests:
          - not_null

      - name: total_amount
        description: "Gross order financial value before item-level adjustments."
        tests:
          - not_null

      - name: payment_method_id
        description: "Foreign key reference to stg_payment_methods.payment_method_id."
        tests:
          - not_null

      - name: created_at
        description: "Timestamp when the order record was created."
        tests:
          - not_null

      - name: updated_at
        description: "Timestamp when the order status was last updated."

      - name: _ingested_at
        description: "Metadata timestamp when the record was processed by dbt."
        tests:
          - not_null
