# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# dbt Gold Model Documentation & Schema Assertions: fact_order_items
# ==============================================================================

version: 2

models:
  - name: fact_order_items
    description: >
      Line-item grain fact table capturing individual product SKU sales, unit prices,
      discounts, and net sub totals with multi-dimensional keys in the Kimball Galaxy Schema.
    columns:
      - name: order_item_id
        description: "Primary key identifier for the order line item."
        tests:
          - unique
          - not_null

      - name: order_id
        description: "Foreign key referencing the parent order in fact_order."
        tests:
          - not_null
          - relationships:
              to: ref('fact_order')
              field: order_id

      - name: customer_key
        description: "Foreign key referencing dim_customer."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id

      - name: product_key
        description: "Foreign key referencing dim_product."
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id

      - name: payment_method_key
        description: "Foreign key referencing dim_payment_method."
        tests:
          - not_null
          - relationships:
              to: ref('dim_payment_method')
              field: payment_method_id

      - name: order_date_key
        description: "Foreign key referencing dim_date in YYYYMMDD format."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: quantity
        description: "Quantity of product units ordered in this item line."
        tests:
          - not_null

      - name: price
        description: "Unit selling price of the product."
        tests:
          - not_null

      - name: discount_amt
        description: "Line-level discount amount applied."
        tests:
          - not_null

      - name: sub_total
        description: "Net revenue for this line item (quantity * price - discount_amt)."
        tests:
          - not_null

      - name: _created_at
        description: "Timestamp when the fact record was generated in Gold layer."
        tests:
          - not_null
