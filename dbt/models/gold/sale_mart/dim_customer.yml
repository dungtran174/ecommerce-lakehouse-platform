# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# dbt Gold Model Documentation & Schema Assertions: dim_customer
# ==============================================================================

version: 2

models:
  - name: dim_customer
    description: >
      Gold analytical dimension table storing customer profiles for Kimball Galaxy Schema.
      Provides cleansed demographic and loyalty attributes for multi-dimensional business reporting.
    columns:
      - name: customer_id
        description: "Primary key identifier for the customer."
        tests:
          - unique
          - not_null

      - name: first_name
        description: "Customer first name."
        tests:
          - not_null

      - name: last_name
        description: "Customer last name."
        tests:
          - not_null

      - name: gender
        description: "Standardized customer gender."

      - name: tire
        description: "Customer loyalty program tier."
        tests:
          - not_null

      - name: address
        description: "Geographic province / region for spatial analysis."

      - name: _created_at
        description: "Timestamp when the dimension record was populated in Gold layer."
        tests:
          - not_null
