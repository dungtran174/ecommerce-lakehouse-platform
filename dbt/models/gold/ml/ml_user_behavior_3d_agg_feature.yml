# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# dbt Gold ML Model Documentation & Schema Assertions: ml_user_behavior_3d_agg_feature
# ==============================================================================

version: 2

models:
  - name: ml_user_behavior_3d_agg_feature
    description: >
      3-day rolling window aggregated customer behavior feature store for Spark MLlib.
      Computes behavioral engagement metrics, conversion rates, and the next-day purchase target label.
    columns:
      - name: user_id
        description: "Registered user identifier."
        tests:
          - not_null

      - name: prediction_date
        description: "Reference date T for which features are aggregated over [T-3, T-1]."
        tests:
          - not_null

      - name: label_purchase_tomorrow
        description: "Binary classification target: 1 if user completed an order on date T, 0 otherwise."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: sessions_3d
        description: "Total distinct user browsing sessions in rolling 3-day window."
        tests:
          - not_null

      - name: total_duration_3d
        description: "Cumulative browsing engagement duration in seconds across 3 days."
        tests:
          - not_null

      - name: avg_session_duration_3d
        description: "Average session duration in seconds over the 3-day window."
        tests:
          - not_null

      - name: total_page_views_3d
        description: "Total page views accumulated in rolling 3 days."
        tests:
          - not_null

      - name: total_actions_3d
        description: "Total granular interactions (clicks, views, cart additions) in rolling 3 days."
        tests:
          - not_null

      - name: purchase_sessions_3d
        description: "Count of sessions containing a completed purchase in rolling 3 days."
        tests:
          - not_null

      - name: total_revenue_3d
        description: "Total monetary expenditure generated by the user in rolling 3 days."
        tests:
          - not_null

      - name: view_count_3d
        description: "Count of product detail page views in rolling 3 days."
        tests:
          - not_null

      - name: add_to_cart_count_3d
        description: "Count of add-to-cart events in rolling 3 days."
        tests:
          - not_null

      - name: purchase_count_3d
        description: "Total orders completed by user in rolling 3 days."
        tests:
          - not_null

      - name: search_count_3d
        description: "Count of search queries submitted in rolling 3 days."
        tests:
          - not_null

      - name: wishlist_count_3d
        description: "Count of items added to wishlist in rolling 3 days."
        tests:
          - not_null

      - name: checkout_view_count_3d
        description: "Count of checkout funnel step views in rolling 3 days."
        tests:
          - not_null

      - name: distinct_products_3d
        description: "Count of distinct product SKUs interacted with in rolling 3 days."
        tests:
          - not_null

      - name: avg_product_price_3d
        description: "Average price of products interacted with in rolling 3 days."
        tests:
          - not_null

      - name: cart_conversion_rate_3d
        description: "Ratio of purchases to cart adds (purchase_count_3d / add_to_cart_count_3d)."
        tests:
          - not_null

      - name: purchase_conversion_rate_3d
        description: "Ratio of purchases to total actions (purchase_count_3d / total_actions_3d)."
        tests:
          - not_null

      - name: actions_per_session_3d
        description: "Average actions per session (total_actions_3d / sessions_3d)."
        tests:
          - not_null

      - name: purchase_session_rate_3d
        description: "Ratio of purchase sessions to total sessions (purchase_sessions_3d / sessions_3d)."
        tests:
          - not_null

      - name: _created_at
        description: "Timestamp when feature vector was generated in Gold layer."
        tests:
          - not_null
