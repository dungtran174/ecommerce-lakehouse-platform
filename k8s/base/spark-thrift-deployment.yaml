# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# Apache Spark Thrift Server 3.3.3 Kubernetes Deployment
# Provides distributed SQL query processing over Delta Lake & MinIO
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-thrift-server
  namespace: lakehouse
  labels:
    app: spark-thrift-server
    tier: compute
    component: query-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-thrift-server
  template:
    metadata:
      labels:
        app: spark-thrift-server
        tier: compute
        component: query-engine
    spec:
      containers:
        - name: spark-thrift-server
          image: lakehouse/spark-thrift-server:3.3.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: thrift
              containerPort: 10000
              protocol: TCP
            - name: web-ui
              containerPort: 4040
              protocol: TCP
          env:
            - name: SPARK_MODE
              value: "thrift"
            - name: SPARK_DRIVER_MEMORY
              value: "2g"
            - name: SPARK_EXECUTOR_MEMORY
              value: "2g"
            - name: HIVE_METASTORE_URIS
              value: "thrift://hive-metastore:9083"
            - name: MINIO_ENDPOINT
              value: "http://minio:9000"
            - name: MINIO_ACCESS_KEY
              value: "minioadmin"
            - name: MINIO_SECRET_KEY
              value: "minioadmin"
            - name: SPARK_SUBMIT_OPTS
              value: "-Dspark.kubernetes.executor.podTemplateFile=/opt/spark/pod-template/executor-pod-template.yaml"
          readinessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 4Gi
          volumeMounts:
            - name: executor-template-vol
              mountPath: /opt/spark/pod-template
              readOnly: true
      volumes:
        - name: executor-template-vol
          configMap:
            name: spark-executor-pod-template
