# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# Kubernetes Kustomization Manifest - Base Infrastructure
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lakehouse

resources:
  - minio-statefulset.yaml
  - minio-service.yaml
  - hive-metastore-deployment.yaml
  - hive-metastore-service.yaml
  - spark-thrift-deployment.yaml
  - spark-thrift-service.yaml
  - spark-executor-pod-template.yaml
  - airflow-deployment.yaml
  - airflow-service.yaml
  - ranger-deployment.yaml
  - ranger-service.yaml
  - trino-deployment.yaml
  - trino-service.yaml
  - metabase-deployment.yaml
  - metabase-service.yaml
  - cloudbeaver-deployment.yaml
  - cloudbeaver-service.yaml
  - ../ingress/minio-ingress.yaml
  - ../ingress/spark-ui-ingress.yaml
  - ../ingress/airflow-ingress.yaml
  - ../ingress/ranger-ingress.yaml
  - ../ingress/trino-ingress.yaml
  - ../ingress/metabase-ingress.yaml
  - ../ingress/cloudbeaver-ingress.yaml
