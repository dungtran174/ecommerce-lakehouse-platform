# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# Apache Ranger Kubernetes Services Manifest
# Exposes Ranger PostgreSQL DB (5432) and Ranger Admin Web/REST API (6080)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: ranger-db
  namespace: lakehouse
  labels:
    app: ranger
    tier: security
    component: database
spec:
  type: ClusterIP
  selector:
    app: ranger
    component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ranger-admin
  namespace: lakehouse
  labels:
    app: ranger
    tier: security
    component: admin
spec:
  type: ClusterIP
  selector:
    app: ranger
    component: admin
  ports:
    - name: http
      port: 6080
      targetPort: 6080
      protocol: TCP
