# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# MinIO Object Storage ClusterIP Service
# Exposes S3 API (Port 9000) and Web Console (Port 9001)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: lakehouse
  labels:
    app: minio
    tier: storage
    component: object-store
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
