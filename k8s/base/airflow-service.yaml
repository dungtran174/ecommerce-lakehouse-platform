# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# Apache Airflow Webserver ClusterIP Service
# Exposes Airflow UI and REST API on port 8080
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: lakehouse
  labels:
    app: airflow
    tier: orchestration
    component: webserver
spec:
  type: ClusterIP
  selector:
    app: airflow
    component: webserver
  ports:
    - name: webserver
      port: 8080
      targetPort: 8080
      protocol: TCP
