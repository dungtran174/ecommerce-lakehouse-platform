# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# CloudBeaver Web SQL IDE Kubernetes Deployment
# Exposes Web SQL workspace for data analysts on port 8978
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  namespace: lakehouse
  labels:
    app: cloudbeaver
    tier: client
    component: web-sql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudbeaver
  template:
    metadata:
      labels:
        app: cloudbeaver
        tier: client
        component: web-sql
    spec:
      containers:
        - name: cloudbeaver
          image: dbeaver/cloudbeaver:23.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8978
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8978
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8978
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: cloudbeaver-workspace
              mountPath: /opt/cloudbeaver/workspace
      volumes:
        - name: cloudbeaver-workspace
          emptyDir: {}
