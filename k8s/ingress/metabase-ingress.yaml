# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# Nginx Ingress Manifest for Metabase Business Intelligence Web UI
# Routes hostname: metabase.lakehouse.local
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metabase-ingress
  namespace: lakehouse
  labels:
    app: metabase
    tier: bi
    component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: metabase.lakehouse.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metabase
                port:
                  number: 3000
