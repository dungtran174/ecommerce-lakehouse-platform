# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# Nginx Ingress Manifest for Apache Zeppelin Notebook Web UI
# Routes hostname: zeppelin.lakehouse.local
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeppelin-ingress
  namespace: lakehouse
  labels:
    app: zeppelin
    tier: ml
    component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/websocket-services: "zeppelin"
spec:
  rules:
    - host: zeppelin.lakehouse.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zeppelin
                port:
                  number: 8080
