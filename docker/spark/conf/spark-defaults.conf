# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# Apache Spark Default Configurations (Spark 3.3 / Delta Lake 2.2 / MinIO / HMS)
# ==============================================================================

# Execution & Resource Settings
spark.master                                    local[*]
spark.driver.memory                             2g
spark.executor.memory                           2g
spark.driver.maxResultSize                      1g

# Delta Lake 2.2 Table Format & Catalog Extensions
spark.sql.extensions                            io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                 org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.sources.default                       delta
spark.sql.legacy.createHiveTableByDefault       false

# S3A Object Storage Settings for MinIO
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                    http://minio:9000
spark.hadoop.fs.s3a.access.key                  minioadmin
spark.hadoop.fs.s3a.secret.key                  minioadmin
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.connection.ssl.enabled      false
spark.hadoop.fs.s3a.aws.credentials.provider    org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.fast.upload                 true
spark.hadoop.fs.s3a.connection.maximum          100

# Centralized Hive Metastore Catalog Integration
spark.sql.warehouse.dir                         s3a://lakehouse/warehouse
spark.hadoop.hive.metastore.uris                thrift://hive-metastore:9083
spark.hadoop.hive.metastore.schema.verification false

# Adaptive Query Execution (AQE) for Performance Optimization
spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true
spark.sql.adaptive.skewJoin.enabled             true

# Spark Thrift Server Settings
spark.thriftserver.transportMode                binary
spark.sql.hive.thriftServer.singleSession       false
spark.driver.extraJavaOptions                   -Dderby.system.home=/tmp/derby
