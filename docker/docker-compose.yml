# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# Infrastructure & Storage Services Docker Compose Stack
# ==============================================================================

version: "3.8"

networks:
  lakehouse-net:
    name: lakehouse-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mysql_oltp_data:
    name: lakehouse_mysql_oltp_data
  minio_data:
    name: lakehouse_minio_data
  metastore_db_data:
    name: lakehouse_metastore_db_data
  airflow_postgres_data:
    name: lakehouse_airflow_postgres_data
  airflow_logs:
    name: lakehouse_airflow_logs

services:
  # ----------------------------------------------------------------------------
  # Source OLTP Database: MySQL 8.0
  # Hosts transactional schema: customers, products, brands, orders, etc.
  # ----------------------------------------------------------------------------
  mysql-oltp:
    image: mysql:8.0
    container_name: lakehouse-mysql-oltp
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_oltp}
      MYSQL_USER: ${MYSQL_USER:-lakehouse_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lakehouse_password}
    ports:
      - "${MYSQL_OLTP_PORT:-3306}:3306"
    volumes:
      - mysql_oltp_data:/var/lib/mysql
      - ../data_generators/schema_oltp.sql:/docker-entrypoint-initdb.d/01_schema_oltp.sql:ro
    networks:
      lakehouse-net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # S3-Compatible Distributed Object Storage: MinIO
  # Stores Lakehouse Bronze, Silver, Gold data tiers, logs, and ML artifacts
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    hostname: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
      MINIO_BROWSER: "on"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      lakehouse-net:
        ipv4_address: 172.28.0.20
        aliases:
          - s3.lakehouse.local
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # MinIO Bucket Provisioner: MinIO Client (mc)
  # Automatically executes scripts/init_minio.sh to provision multi-tier buckets
  # ----------------------------------------------------------------------------
  minio-create-buckets:
    image: minio/mc:latest
    container_name: lakehouse-minio-create-buckets
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET:-lakehouse}
    volumes:
      - ../scripts/init_minio.sh:/init_minio.sh:ro
    entrypoint: ["/bin/sh", "/init_minio.sh"]
    networks:
      lakehouse-net:

  # ----------------------------------------------------------------------------
  # Hive Metastore Backend Database: MySQL 8.0
  # Stores relational schema metadata, partition descriptors, and column specs
  # ----------------------------------------------------------------------------
  metastore-db:
    image: mysql:8.0
    container_name: lakehouse-metastore-db
    hostname: metastore-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${METASTORE_DB_PASSWORD:-hivepassword}
      MYSQL_DATABASE: ${METASTORE_DB_NAME:-metastore_db}
      MYSQL_USER: ${METASTORE_DB_USER:-hive}
      MYSQL_PASSWORD: ${METASTORE_DB_PASSWORD:-hivepassword}
    ports:
      - "${METASTORE_DB_PORT:-3307}:3306"
    volumes:
      - metastore_db_data:/var/lib/mysql
    networks:
      lakehouse-net:
        ipv4_address: 172.28.0.30
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${METASTORE_DB_PASSWORD:-hivepassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Technical Catalog & Metadata Service: Apache Hive Metastore 3.0
  # Exposes Thrift RPC on port 9083 for Delta Lake catalog operations
  # ----------------------------------------------------------------------------
  hive-metastore:
    build:
      context: ./hive-metastore
      dockerfile: Dockerfile
    image: lakehouse/hive-metastore:3.0.0
    container_name: lakehouse-hive-metastore
    hostname: hive-metastore
    restart: unless-stopped
    depends_on:
      metastore-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      METASTORE_DB_HOST: metastore-db
      METASTORE_DB_PORT: 3306
      METASTORE_DB_NAME: ${METASTORE_DB_NAME:-metastore_db}
      METASTORE_DB_USER: ${METASTORE_DB_USER:-hive}
      METASTORE_DB_PASSWORD: ${METASTORE_DB_PASSWORD:-hivepassword}
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET:-lakehouse}
    ports:
      - "${METASTORE_PORT:-9083}:9083"
    networks:
      lakehouse-net:
        ipv4_address: 172.28.0.31
        aliases:
          - metastore.lakehouse.local
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9083"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ----------------------------------------------------------------------------
  # Distributed Compute Engine: Apache Spark 3.3 Thrift Server
  # Serves JDBC/ODBC on port 10000 and Spark Application Web UI on port 4040
  # ----------------------------------------------------------------------------
  spark-thrift-server:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: lakehouse/spark-thrift-server:3.3.3
    container_name: lakehouse-spark-thrift-server
    hostname: spark-thrift-server
    restart: unless-stopped
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-2g}
      SPARK_LOCAL_IP: 172.28.0.40
    ports:
      - "${SPARK_THRIFT_PORT:-10000}:10000"
      - "${SPARK_UI_PORT:-4040}:4040"
    networks:
      lakehouse-net:
        ipv4_address: 172.28.0.40
        aliases:
          - spark.lakehouse.local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4040"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ----------------------------------------------------------------------------
  # Airflow Metadata Backend Database: PostgreSQL 14
  # Stores DAG metadata, run histories, task instance states, and XComs
  # ----------------------------------------------------------------------------
  airflow-postgres:
    image: postgres:14
    container_name: lakehouse-airflow-postgres
    hostname: airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    ports:
      - "${AIRFLOW_METASTORE_PORT:-5432}:5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      lakehouse-net:
        ipv4_address: 172.28.0.50
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER:-airflow}", "-d", "${AIRFLOW_DB_NAME:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Airflow Database Migration & Admin User Provisioner
  # Runs database schema initialization and creates administrator credentials
  # ----------------------------------------------------------------------------
  airflow-init:
    image: apache/airflow:2.7.3
    container_name: lakehouse-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqJZPo=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
      - ../airflow/config/airflow.cfg:/opt/airflow/airflow.cfg:ro
    networks:
      lakehouse-net:
        ipv4_address: 172.28.0.51
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init && \
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}" \
          --firstname "Admin" \
          --lastname "User" \
          --role "Admin" \
          --email "admin@lakehouse.local"

  # ----------------------------------------------------------------------------
  # Airflow Webserver: Apache Airflow 2.7.3 UI
  # Provides DAG orchestration dashboard and REST API on port 8080
  # ----------------------------------------------------------------------------
  airflow-webserver:
    image: apache/airflow:2.7.3
    container_name: lakehouse-airflow-webserver
    hostname: airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqJZPo=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-lakehouse_airflow_secret_key_2025}
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
      - ../airflow/config/airflow.cfg:/opt/airflow/airflow.cfg:ro
    networks:
      lakehouse-net:
        ipv4_address: 172.28.0.52
        aliases:
          - airflow.lakehouse.local
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Airflow Scheduler: Apache Airflow 2.7.3 Job Scheduler
  # Evaluates DAG schedules and dispatches task executions via LocalExecutor
  # ----------------------------------------------------------------------------
  airflow-scheduler:
    image: apache/airflow:2.7.3
    container_name: lakehouse-airflow-scheduler
    hostname: airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqJZPo=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-lakehouse_airflow_secret_key_2025}
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
      - ../airflow/config/airflow.cfg:/opt/airflow/airflow.cfg:ro
    networks:
      lakehouse-net:
        ipv4_address: 172.28.0.53
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s



