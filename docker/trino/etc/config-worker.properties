# ==============================================================================
# Modern E-Commerce Data Lakehouse Platform
# Trino Worker Server Configuration - Performance & Concurrency Tuned
# ==============================================================================
coordinator=false
http-server.http.port=8085
discovery.uri=http://trino-coordinator:8085

# Memory Management & Query Limits
query.max-memory=4GB
query.max-memory-per-node=1GB
query.max-total-memory-per-node=2GB

# Distributed Query Execution & Concurrency Tuning
task.concurrency=8
task.http-response-threads=8
task.info-update-interval=2s
exchange.client-threads=8
