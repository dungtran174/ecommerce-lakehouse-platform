# ==============================================================================
# Trino Catalog Configuration: Delta Lake Connector for MinIO Object Storage
# Enables distributed query execution over ACID Delta tables via Hive Metastore
# ==============================================================================
connector.name=delta-lake
hive.metastore.uri=thrift://hive-metastore:9083

# S3 File System & MinIO Object Storage Settings
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
s3.ssl.enabled=false

# Delta Lake Features & Metadata Caching
delta.register-table-procedure.enabled=true
delta.metadata.cache-ttl=10m
