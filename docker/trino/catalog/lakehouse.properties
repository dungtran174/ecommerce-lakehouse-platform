# ==============================================================================
# Trino Catalog Configuration: Lakehouse Delta Lake Connector for MinIO Storage
# Primary analytical catalog matching Ranger RBAC security policies
# ==============================================================================
connector.name=delta-lake
hive.metastore.uri=thrift://hive-metastore:9083

# S3 File System & MinIO Object Storage Settings
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
s3.ssl.enabled=false

# Delta Lake Features & Metadata Caching Tuning
delta.register-table-procedure.enabled=true
delta.metadata.cache-ttl=10m
delta.metadata.cache-size=1000
delta.max-partitions-per-writer=100

# Metastore Client Caching
hive.metastore-cache-ttl=10m
hive.metastore-refresh-interval=2m
hive.metastore-cache-maximum-size=5000
hive.metastore.partition-batch-size=1000
