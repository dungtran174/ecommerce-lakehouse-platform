# ==============================================================================
# Trino Catalog Configuration: Hive Connector for MinIO Object Storage
# Performance-tuned metadata caching, Parquet columnar optimization, and Metastore
# ==============================================================================
connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083

# Native S3 & Unified S3 Configuration
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
s3.ssl.enabled=false

# Legacy Hive S3 Properties for Compatibility
hive.s3.endpoint=http://minio:9000
hive.s3.path-style-access=true
hive.s3.aws-access-key=minioadmin
hive.s3.aws-secret-key=minioadmin
hive.s3.ssl.enabled=false

# Storage & File Format Defaults
hive.storage-format=PARQUET

# Performance Tuning & Metadata Caching
hive.metastore-cache-ttl=10m
hive.metastore-refresh-interval=2m
hive.metastore-cache-maximum-size=5000
hive.metastore.partition-batch-size=1000
hive.parquet.use-column-names=true
